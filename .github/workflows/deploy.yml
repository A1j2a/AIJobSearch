name: Vercel CI/CD Auto-Deploy

on:
  push:
    branches:
      - prototype_cluster_protocol
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Check
        run: npm run build

      - name: Trigger Vercel Deployment via API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          curl -X POST "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"job-search-with-ai\",
              \"gitSource\": {
                \"type\": \"github\",
                \"repoId\": \"$(curl -s https://api.github.com/repos/A1j2a/AIJobSearch | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"id\"])')\",
                \"ref\": \"${{ github.ref_name }}\"
              },
              \"target\": \"production\"
            }" | python3 -c "import json,sys; d=json.load(sys.stdin); print('Deployment URL:', d.get('url',''), 'State:', d.get('readyState', d.get('status','')))"
